# Local development environment.
# Kept in lockstep with requirements.txt — change both together.
#
#   conda env create -f environment.yml
#   conda activate vub-news

name: vub-news

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip
  - pip:
      - pandas==2.3.3
      - pyarrow==21.0.0
      - numpy==2.3.5
      - bm25s==0.3.10
      - nltk==3.10.1
      - faiss-cpu==1.15.0
      - transformers==5.14.1
      - torch==2.13.0
      - scikit-learn==1.9.0
      - lightgbm==4.7.0
      - huggingface-hub==1.26.0
      - gdown==6.1.0
      - requests==2.34.2
      - tqdm==4.70.0
      - pytest==9.1.1
